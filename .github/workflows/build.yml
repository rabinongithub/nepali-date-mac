
name: Build Nepali Date Mac App

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build app and DMG
        run: |
          chmod +x build-mac-app.sh
          ./build-mac-app.sh
          ls -lh Nepali-Date.dmg

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: Nepali-Date-Mac-DMG
          path: Nepali-Date.dmg
          if-no-files-found: error
